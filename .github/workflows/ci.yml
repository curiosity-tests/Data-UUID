---
name: Run Tests
run-name: "Run Tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "15 6 * * 0"  # Once weekly, on Sundays

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  perl-versions:
    name: "Retrieve available perl-tester versions"
    runs-on: ubuntu-latest

    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}

    steps:
      - id: action
        uses: perl-actions/perl-versions@v2
        with:
          since-perl: "5.08"

  test:
    name: "Linux, Perl v${{ matrix.perl-version }}"
    needs: perl-versions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ fromJson (needs.perl-versions.outputs.perl-versions) }}

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    env:
      AUTHOR_TESTING: 1

    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Perl version
        run: perl -V

      - name: Install dependencies
        uses: perl-actions/install-with-cpanm@v1
        with:
          sudo: false
          args: "--installdeps ."

      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Test
        run: make test

      - name: Archive CPANM logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: ~/.cpanm/work/*/build.log
